  /reservations/{inquiry_id}:
    post:
      consumes:
      - application/json
      description: Menyimpan reservation
      parameters:
      - description: Inquiry ID
        in: path
        name: inquiry_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Save reservation
      tags:
      - Reservation
  /reservations/inquiry:
    post:
      consumes:
      - application/json
      description: Save Inquiry
      parameters:
      - description: Reservation Request
        in: body
        name: reservation
        required: true
        schema:
          $ref: '#/definitions/model.ReservationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Save Inquiry
      tags:
      - Reservation
  /reservations/schedules:
    get:
      consumes:
      - application/json
      description: Mendapatkan jadwal reservation room berdasarkan rentang tanggal
      parameters:
      - description: Start date
        in: query
