  /rooms:
    get:
      consumes:
      - application/json
      description: Get rooms with filters (name, roomType, capacity)
      parameters:
      - description: Room name filter
        in: query
        name: name
        type: string
      - description: Room type filter (1=Small, 2=Medium, 3=Large)
        in: query
        name: roomType
        type: integer
      - description: Capacity filter (1=<10, 2=11-50, 3=51-100)
        in: query
        name: capacity
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Get all rooms
      tags:
      - Room
    post:
      consumes:
      - multipart/form-data
      description: Menyimpan room dengan upload file gambar
      parameters:
      - description: Room Name
        in: formData
        name: name
        required: true
        type: string
      - description: Room Type ID
        in: formData
        name: room_type_id
        required: true
        type: integer
      - description: Price
        in: formData
        name: price
        required: true
        type: integer
      - description: Capacity
        in: formData
        name: capacity
        required: true
        type: integer
      - description: Room Image
        in: formData
        name: image
        required: true
        type: file
      produces:
