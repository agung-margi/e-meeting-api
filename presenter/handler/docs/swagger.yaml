  /room-schedule:
    get:
      consumes:
      - application/json
      description: Mendapatkan jadwal room
      parameters:
      - description: Room ID
        in: query
        name: room_id
        required: true
        type: integer
      - description: Date
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
