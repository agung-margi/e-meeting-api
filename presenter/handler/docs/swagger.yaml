basePath: /
definitions:
  model.LoginRequest:
    properties:
      password:
        example: password
        minLength: 6
        type: string
      username:
        example: user1
        minLength: 2
        type: string
    required:
    - password
    - username
    type: object
  model.ReservationRequest:
    properties:
      bookingDate:
        example: "2025-02-01"
        type: string
      company:
        example: ABC Company
        type: string
      endTime:
        example: "09:00"
        type: string
      name:
        example: John Doe
        type: string
      notes:
        example: Additional notes
        type: string
      participants:
        example: 10
        type: integer
      phone:
        example: "1234567890"
        type: string
      roomId:
        example: 2
        type: integer
      snackId:
        example: 1
        type: integer
      startTime:
        example: "08:00"
        type: string
    type: object
  model.UserRequest:
    properties:
      email:
        example: user1@example.com
        type: string
      password:
        example: password
        minLength: 6
        type: string
      username:
        example: user1
        minLength: 2
        type: string
    required:
    - email
    - password
    - username
    type: object
  response.APIResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Ini adalah API untuk E-Meeting
  termsOfService: http://swagger.io/terms/
  title: E-Meeting API
  version: "1.0"
paths:
  /dashboard:
    get:
      consumes:
      - application/json
      description: Mendapatkan data dashboard
      parameters:
      - description: Start date
        in: query
        name: start_date
        type: string
      - description: End date
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: Get dashboard data
      tags:
      - Dashboard
  /login:
    post:
      consumes:
      - application/json
      description: 'Melakukan login user berdasarkan username dan password misalnya
        "username": "user1", "password": "password"'
      parameters:
      - description: Login Request
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Login user
      tags:
      - Authentication
  /register:
    post:
      consumes:
      - application/json
      description: Menyimpan User
      parameters:
      - description: User Request
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.UserRequest'
      produces:
