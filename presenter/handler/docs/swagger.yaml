definitions:
  model.LoginRequest:
    properties:
      password:
        example: password
        minLength: 6
        type: string
      username:
        example: user1
        minLength: 2
        type: string
    required:
    - password
    - username
    type: object
  model.ReservationRequest:
    properties:
      bookingDate:
        example: "2025-02-01"
        type: string
      company:
        example: ABC Company
        type: string
      endTime:
        example: "09:00"
        type: string
      name:
        example: John Doe
        type: string
      notes:
        example: Additional notes
        type: string
      participants:
        example: 10
        type: integer
      phone:
        example: "1234567890"
        type: string
      roomId:
        example: 2
        type: integer
      snackId:
        example: 1
        type: integer
      startTime:
        example: "08:00"
        type: string
      userId:
        example: 1
        type: integer
    type: object
  model.RoomRequest:
    properties:
      capacity:
        example: 20
        minimum: 1
        type: integer
      id:
        type: integer
      imgUrl:
        example: https://example.com/image.jpg
        type: string
      name:
        example: Aster Room
        minLength: 2
        type: string
      price:
        example: 10000
        minimum: 1
        type: integer
      room_type:
        example: 1
        minimum: 1
        type: integer
    required:
    - capacity
    - name
    - price
    - room_type
    type: object
  model.UpdateUserRequest:
    properties:
      imgUrl:
        example: https://example.com/image.jpg
        type: string
      isActive:
        example: true
        type: boolean
      password:
        example: password
        minLength: 6
        type: string
    type: object
  model.UserRequest:
    properties:
      email:
        example: user1@example.com
        type: string
      password:
        example: password
        minLength: 6
        type: string
      username:
        example: user1
        minLength: 2
        type: string
    required:
    - email
    - password
    - username
    type: object
  response.APIResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: integer
    type: object
info:
  contact: {}
paths:
